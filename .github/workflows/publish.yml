# Publishes to npm with provenance when a GitHub release is published.
# Requires an npm automation token stored as the NPM_TOKEN repository secret.
# The prepublishOnly guard (pnpm run ci) runs automatically before publish.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Verify release tag matches package.json version
      if: github.event_name == 'release'
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION=$(node -p "require('./package.json').version")
        if [ "${TAG#v}" != "$VERSION" ]; then
          echo "Release tag $TAG does not match package.json version $VERSION" >&2
          exit 1
        fi
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm install --frozen-lockfile
    - run: pnpm publish --provenance --access public --no-git-checks
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
